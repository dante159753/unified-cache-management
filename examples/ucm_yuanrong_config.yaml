# UCM + YuanRong + Posix configuration example.
#
# The YuanRong SDK and worker must be available before starting vLLM.
# For YuanRong|Posix with io_direct enabled, start every YuanRong worker with
# memory_alignment=4096. Keep oc_metadata_header enabled so the asynchronous
# Posix dump can hold a read latch. The SDK obtains memory_alignment from the
# worker during registration; UCM uses yuanrong_memory_alignment for Posix.

ucm_connectors:
  - ucm_connector_name: "UcmPipelineStore"
    ucm_connector_config:
      store_pipeline: "YuanRong|Posix"
      yuanrong_host: "127.0.0.1"
      yuanrong_port: 18481
      yuanrong_namespace: "ucm_model"
      yuanrong_enable_remote_h2d: false
      yuanrong_memory_alignment: 4096
      yuanrong_timeout_ms: 60000
      yuanrong_waiting_queue_depth: 8192
      yuanrong_load_worker_count: 4
      # Posix cold recovery pipeline batch size.
      yuanrong_recovery_batch_size: 32
      # Pinned host memory usage is count * one UCM shard size.
      yuanrong_host_buffer_count: 128
      yuanrong_h2d_stream_count: 4
      yuanrong_backfill_worker_count: 1
      yuanrong_backfill_queue_depth: 128
      yuanrong_reaper_queue_depth: 8192

      share_buffer_enable: true
      storage_backends: "/mnt/ucm"
      posix_io_engine: "psync"
      io_direct: true

enable_event_sync: true
use_layerwise: false
