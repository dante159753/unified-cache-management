name: A2 Self-hosted Runner Smoke

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, npu, ubuntu-24.04-arm]
    timeout-minutes: 10
    steps:
      - name: Show runner context
        run: |
          set -euxo pipefail
          uname -a
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "arch=$(uname -m)"

      - name: Check GitHub connectivity through proxy
        env:
          HTTP_PROXY: http://127.0.0.1:7898
          HTTPS_PROXY: http://127.0.0.1:7898
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          set -euxo pipefail
          curl -fsSLI --connect-timeout 10 --max-time 30 https://github.com

      - name: Check Docker socket
        run: |
          set -euxo pipefail
          docker version
          docker info --format '{{.Architecture}}'
